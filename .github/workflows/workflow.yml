name: Publish to PyPI

on:
  release:
    types: [published] # Triggered when a GitHub Release is published

jobs:
  build-n-publish:
    name: Build and publish Python distro to PyPI
    runs-on: ubuntu-latest

    # Required for trusted publishing
    permissions:
      contents: read
      id-token: write # Needed for PyPI OIDC authentication

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Run unit tests
      run: python -m pytest -m "not integration" -q

    - name: Build package
      run: |
        python -m pip install build
        python -m build

    - name: Publish package distribution to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
