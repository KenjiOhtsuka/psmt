name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -m "not integration" -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ODBC Driver 18 for SQL Server
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: Start databases
        run: docker compose -f docker/docker-compose.yml up -d
      - name: Wait for databases
        run: |
          ALL_HEALTHY=0
          for i in $(seq 1 150); do
            HEALTHY=$(docker compose -f docker/docker-compose.yml ps --format '{{.Health}}' | grep -c '^healthy$' || true)
            if [ "$HEALTHY" -ge 4 ]; then
              echo "all databases healthy"
              ALL_HEALTHY=1
              break
            fi
            sleep 5
          done
          docker compose -f docker/docker-compose.yml ps
          if [ "$ALL_HEALTHY" -ne 1 ]; then
            echo "::error::one or more databases did not become healthy"
            docker compose -f docker/docker-compose.yml logs
            exit 1
          fi
      - name: Run integration tests
        run: python -m pytest -m integration -v
      - name: Tear down databases
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
